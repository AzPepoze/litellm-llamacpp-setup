services:

  tinyllama:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: tinyllama
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./models:/models
    environment:
      - HF_HOME=/models
    command: >
      -hf TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF:Q4_K_M
      --host 0.0.0.0
      --port 8080
      --ctx-size 2048
      --threads 4
    networks:
          - default
          - gateway-net

  qwen-small:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: qwen-small
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./models:/models
    environment:
      - HF_HOME=/models
    command: >
      -hf Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M
      --host 0.0.0.0
      --port 8080
      --ctx-size 2048
      --threads 4
    networks:
          - default
          - gateway-net

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=litellm-secret-pass
      - POSTGRES_DB=litellm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
          - default
          - gateway-net

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      tinyllama:
        condition: service_started
      qwen-small:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://litellm:litellm-secret-pass@postgres:5432/litellm
      - LITELLM_MASTER_KEY=sk-super-secret-key
      - STORE_MODEL_IN_DB=True
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    command:
      - "--config"
      - "/app/config.yaml"
    networks:
          - default
          - gateway-net

networks:
  gateway-net:
    external: true
    
volumes:
  postgres_data:
