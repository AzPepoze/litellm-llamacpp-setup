services:

  tinyllama:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: tinyllama
    restart: unless-stopped

    expose:
      - "8080"

    volumes:
      - ./models:/models

    environment:
      - HF_HOME=/models

    command: >
      -hf TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF:Q4_K_M
      --host 0.0.0.0
      --port 8080
      --ctx-size 2048
      --threads 4

  qwen-small:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: qwen-small
    restart: unless-stopped

    expose:
      - "8080"

    volumes:
      - ./models:/models

    environment:
      - HF_HOME=/models

    command: >
      -hf Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M
      --host 0.0.0.0
      --port 8080
      --ctx-size 2048
      --threads 4

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped

    ports:
      - "4000:4000"

    depends_on:
      - tinyllama
      - qwen-small

    volumes:
      - ./litellm/config.yaml:/app/config.yaml

    command:
      - "--config"
      - "/app/config.yaml"
