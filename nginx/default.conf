server {
    listen 80;
    server_name llm.bwrpsp.dev;

    # Only allow /v1/* requests
    location /v1/ {
        proxy_pass http://litellm:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering for SSE streaming (completions, chat, etc.)
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Block all other endpoints with 403 Forbidden
    location / {
        return 403;
    }
}

server {
    listen 80;
    server_name admin.bwrpsp.dev;

    # Redirect root path / directly to /ui/
    location = / {
        return 302 /ui/;
    }

    # Proxy all other requests to litellm (including /ui/, assets, model/key APIs)
    location / {
        proxy_pass http://litellm:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Support websockets and keep-alive (useful for dashboard logs and events)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
