events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ==========================================
    # LOGGING
    # ==========================================
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    # ==========================================
    # SECURITY & OPTIMIZATION
    # ==========================================
    sendfile        on;
    keepalive_timeout  65;

    # ==========================================
    # RATE LIMIT (For LLM Client Queries)
    # ==========================================
    limit_req_zone $binary_remote_addr zone=llm_limit:10m rate=10r/s;

    # ==========================================
    # 1. LLM API GATEWAY (Port 8080)
    # ==========================================
    server {
        listen 8080;
        server_name _;

        location / {
            # Apply rate limiting
            limit_req zone=llm_limit burst=20 nodelay;

            proxy_pass http://litellm:4000;
            proxy_http_version 1.1;

            # Streaming support (crucial for LLM responses!)
            proxy_buffering off;
            chunked_transfer_encoding on;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ==========================================
    # 2. ADMIN DASHBOARD GATEWAY (Port 80)
    # ==========================================
    server {
        listen 80;
        server_name _;

        # Frontend Static Server
        location / {
            proxy_pass http://admin-frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Backend API Routing
        location /api/ {
            proxy_pass http://admin-backend:5000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
